interface:
  display_name: "科研逐步编程 / Step-by-Step Coding"
  short_description: "从研究问题出发，先跑最小实验，掌握对照、指标、资源与关键实现，用真实证据逐步推进"
  default_prompt: "请用 $step-by-step-coding 接续当前研究包，采用按可见研究进展划分的最小路线。先用标准库保存当前步骤的有效 Notebook，立即给文件链接；仅在已知环境做本步短测，随后交付状态并结束当轮。关键方法在普通 Python 格定义和调用。整组短测最多 60 秒，长任务或未知耗时交给我手动运行。环境与页面准备按需后续处理。说明简短，图表已有数字直接引用，下一验证采用后再细化；纯文字反馈只原位修改说明，保留已有代码与输出。"
