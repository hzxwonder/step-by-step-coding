interface:
  display_name: "科研逐步编程 / Step-by-Step Coding"
  short_description: "从研究问题出发，先跑最小实验，掌握对照、指标、资源与关键实现，用真实证据逐步推进"
  default_prompt: "请用 $step-by-step-coding 接续当前研究包，先在聊天中对齐本步问题、它与核心 idea 的关系及关键做法，沿用已采用条件，只讨论真实未决需求。每个教学步骤包含多组按理解任务划分的 Markdown、代码和输出，步首步尾衔接前后证据。先保存有效 Notebook 并给文件链接，仅在已知环境做本步短测，交付后等我对具体观察或场景反馈。关键方法在普通 Python 格定义和调用。整组短测最多 60 秒，长任务或未知耗时交给我手动运行。环境与页面准备按需后续处理。核心图组后用 Markdown 解释数值来源、结果机制和对 idea 的证据作用，变化数值由代码生成。导航摘要可扫读，必要讨论与推理充分展开；下一验证采用后细化。纯文字反馈原位修改说明，保留代码与输出。"
