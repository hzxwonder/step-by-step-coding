interface:
  display_name: "科研逐步编程 / Step-by-Step Coding"
  short_description: "从研究问题出发，先跑最小实验，掌握对照、指标、资源与关键实现，用真实证据逐步推进"
  default_prompt: "请用 $step-by-step-coding 接续当前研究包，先确认尚未采用的最小步骤路线。路线确定后先保存有效 Notebook，每轮只完成一个可阅读步骤，可含多个普通 Python 代码格。核心定义在当前内核直接调用，使用 ponytail 与 asd-ste100 原则。只限时短测预计不超过 60 秒的内容，长任务或未知耗时交给我手动运行。保存后给约 5 秒可扫读的摘要和文件／已有网址，结束本轮等我反馈，再原位完善或继续下一步。"
